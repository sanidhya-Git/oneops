name: OneOps AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  SF_API_VERSION: '59.0'

jobs:

  # ── Lint & Test: Apex ───────────────────────────────────────────
  apex-analysis:
    name: Apex PMD & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install SFDX / SF CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate Dev Hub
        run: |
          echo "${{ secrets.SF_DEVHUB_JWT_KEY }}" > devhub.key
          sf org login jwt \
            --username     "${{ secrets.SF_DEVHUB_USERNAME }}" \
            --jwt-key-file devhub.key \
            --client-id    "${{ secrets.SF_CONNECTED_APP_ID }}" \
            --alias        devhub \
            --set-default-dev-hub

      - name: Create scratch org
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias          ci-scratch \
            --duration-days  1 \
            --no-track-source

      - name: Push metadata
        run: sf project deploy start --target-org ci-scratch

      - name: Run Apex tests
        run: |
          sf apex run test \
            --target-org    ci-scratch \
            --test-level    RunLocalTests \
            --output-dir    test-results \
            --code-coverage \
            --wait          15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: test-results/

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt


  ai-engine-tests:
    name: AI Engine CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          ONEOPS_API_SECRET: test-secret
          OPENAI_API_KEY: sk-test-mock

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ai-engine/coverage
          flags: ai-engine

  # ── Deploy to Sandbox ────────────────────────────────────────────
  deploy-sandbox:
    name: Deploy → Sandbox
    runs-on: ubuntu-latest
    needs: [apex-analysis, ai-engine-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: sandbox

    steps:
      - uses: actions/checkout@v4

      - name: Setup SF CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate sandbox
        run: |
          echo "${{ secrets.SF_SANDBOX_JWT_KEY }}" > sandbox.key
          sf org login jwt \
            --username     "${{ secrets.SF_SANDBOX_USERNAME }}" \
            --jwt-key-file sandbox.key \
            --client-id    "${{ secrets.SF_CONNECTED_APP_ID }}" \
            --instance-url "${{ secrets.SF_SANDBOX_URL }}" \
            --alias        sandbox

      - name: Deploy to sandbox
        run: |
          sf project deploy start \
            --target-org sandbox \
            --wait       20

      - name: Run post-deploy tests
        run: |
          sf apex run test \
            --target-org sandbox \
            --test-level RunLocalTests \
            --wait       15

      - name: Deploy AI Engine to staging
        if: success()
        run: |
          echo "${{ secrets.STAGING_SSH_KEY }}" > /tmp/staging.key
          chmod 600 /tmp/staging.key
          ssh -i /tmp/staging.key -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd /app/oneops-ai && git pull && docker compose pull ai-engine && docker compose up -d ai-engine"

  # ── Deploy to Production ─────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [apex-analysis, ai-engine-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SF CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate production
        run: |
          echo "${{ secrets.SF_PROD_JWT_KEY }}" > prod.key
          sf org login jwt \
            --username     "${{ secrets.SF_PROD_USERNAME }}" \
            --jwt-key-file prod.key \
            --client-id    "${{ secrets.SF_CONNECTED_APP_ID }}" \
            --instance-url "https://login.salesforce.com" \
            --alias        production

      - name: Deploy to production (Quick Deploy if tests passed in sandbox)
        run: |
          sf project deploy start \
            --target-org production \
            --test-level RunLocalTests \
            --wait       30

      - name: Deploy AI Engine to production
        if: success()
        run: |
          echo "${{ secrets.PROD_SSH_KEY }}" > /tmp/prod.key
          chmod 600 /tmp/prod.key
          ssh -i /tmp/prod.key -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "cd /app/oneops-ai && git pull && docker compose pull ai-engine && docker compose up -d --no-deps ai-engine"

      - name: Notify Slack on deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "OneOps AI production deployment: ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
